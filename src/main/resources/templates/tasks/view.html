<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .task-container { background: white; padding: 30px; border-radius: 15px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="task-container shadow-sm">
                <h1 class="h3 mb-4">📋 Task Details</h1>

                <div class="mb-3">
                    <label class="text-muted small">ID:</label>
                    <p class="fw-bold" th:text="${task.id}">ID</p>
                </div>

                <div class="mb-3">
                    <label class="text-muted small">Description:</label>
                    <p class="fs-5" th:text="${task.description}">Description</p>
                </div>

                <div class="mb-3">
                    <label class="text-muted small">Worker:</label>
                    <p class="fs-5" th:text="${task.workerFullName != null ? task.workerFullName : 'No worker assigned'}">Worker</p>
                </div>


                <div class="mb-4">
                    <label class="text-muted small">Status:</label>
                    <br>
                    <span class="badge rounded-pill fs-6"
                          th:classappend="${task.status.name() == 'DONE'} ? 'bg-success' :
                                         (${task.status.name() == 'IN_PROGRESS'} ? 'bg-warning text-dark' : 'bg-secondary')"
                          th:text="${task.status}">Status</span>
                </div>

                <div class="d-flex gap-2">
                    <a th:href="@{${baseUrl}}" class="btn btn-outline-secondary">Back to List</a>
                    <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-primary">Edit Task</a>

                    <form th:action="@{/tasks/{id}(id=${task.id})}" th:method="post" class="d-inline">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn btn-danger"
                                onclick="return confirm('Are you sure?')">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
