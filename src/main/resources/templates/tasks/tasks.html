<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .task-container { background: white; padding: 30px; border-radius: 15px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        /* Кастомные цвета для статусов, если не хочешь стандартные Bootstrap */
        .status-done { background-color: #d4edda; color: #155724; }
        .status-progress { background-color: #fff3cd; color: #856404; }
        .status-new { background-color: #e2e3e5; color: #383d41; }
    </style>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="task-container shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2" th:text="${pageTitle}">📋 Task List</h1>
            <div class="d-flex gap-2">
                <a th:href="@{/tasks/trash}" class="btn btn-outline-secondary">🗑 Trash</a>

                <a th:href="@{/tasks/new}" class="btn btn-primary">➕ Create New Task</a>

                <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-outline-danger">
                    Logout
                </button>
            </form>
                <a th:if="${isAdminPage}" href="/workers" class="btn btn-secondary"> Workers</a>

            </div>
        </div>


        <div class="card mb-4 shadow-sm border-0">
            <div class="card-body bg-light">
                <form th:action="@{${baseUrl}}" method="get" class="row g-2 align-items-end">

                    <!-- DESCRIPTION(KEYWORD) FILTER -->
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Search:</label>
                        <input type="text" name="keyword" th:value="${keyword}"
                               class="form-control form-control-sm" placeholder="Task description...">
                    </div>

                    <!-- USERNAME FILTER -->
                    <div class="col-md-3"
                         th:if="${isAdminPage}">
                        <label class="form-label small text-muted">Search:</label>
                        <input type="text" name="username" th:value="${username}"
                               class="form-control form-control-sm" placeholder="Worker name...">
                    </div>

                    <!-- STATUS FILTER -->
                    <div class="col-md-2">
                        <label class="form-label small text-muted">Status:</label>
                        <select name="status" class="form-select form-select-sm">
                            <option value="">All</option>
                            <option value="NEW" th:selected="${selectedStatus == 'NEW'}">New</option>
                            <option value="IN_PROGRESS" th:selected="${selectedStatus == 'IN_PROGRESS'}">In Progress</option>
                            <option value="DONE" th:selected="${selectedStatus == 'DONE'}">Done</option>
                        </select>
                    </div>

                    <!-- PRIORITY FILTER -->
                    <div class="col-md-2">
                        <label class="form-label small text-muted">Priority:</label>
                        <select name="priority" class="form-select form-select-sm">
                            <option value="">All</option>
                            <option value="HIGH" th:selected="${selectedPriority == 'HIGH'}">High</option>
                            <option value="MEDIUM" th:selected="${selectedPriority == 'MEDIUM'}">Medium</option>
                            <option value="LOW" th:selected="${selectedPriority == 'LOW'}">Low</option>
                        </select>
                    </div>

                    <!-- DATE & TIME FILTER -->
                    <div class="col-md-2">
                        <label class="form-label small text-muted">From:</label>
                        <input type="text" name="start" id="start-date" th:value="${start != null ? #temporals.format(start, 'yyyy-MM-dd''T''HH:mm') : ''}" class="form-control form-control-sm" placeholder="Select date...">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted">To:</label>
                        <input type="text" name="end" id="end-date" th:value="${end != null ? #temporals.format(end, 'yyyy-MM-dd''T''HH:mm') : ''}" class="form-control form-control-sm" placeholder="Select date...">
                    </div>

                    <div class="col-md-3 d-flex gap-1">
                        <button type="submit" class="btn btn-sm btn-primary flex-grow-1">Filter</button>
                        <a th:href="${baseUrl}"
                           class="btn btn-sm btn-outline-secondary">
                            Reset
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th>Updated At</th>
                    <th>Priority</th>
                    <th th:if="${isAdminPage}">
                        Worker
                    </th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${tasks}">
                    <!-- DESCRIPTION-->
                    <td>
                        <a th:href="@{/tasks/{id}(id=${task.id})}"
                           th:text="${task.description}"
                           class="text-decoration-none fw-semibold text-dark"></a>
                    </td>

                    <!-- STATUS -->
                    <td>
                            <span class="badge rounded-pill"
                                  th:classappend="${task.status.name() == 'DONE'} ? 'bg-success' :
                                                 (${task.status.name() == 'IN_PROGRESS'} ? 'bg-warning text-dark' : 'bg-secondary')"
                                  th:text="${task.status}">
                            </span>
                    </td>

                    <!-- CREATED AT-->
                    <td>
                        <span class="text-muted small"
                              th:text="${#temporals.format(task.createdDate,
                                        'yyyy-MM-dd HH:mm')}">
                        </span>
                    </td>

                    <!-- UPDATED AT -->
                    <td>
                        <span class="text-muted small"
                              th:text="${#temporals.format(task.updatedDate,
                                        'yyyy-MM-dd HH:mm')}">
                        </span>
                    </td>

                    <!-- PRIORITY -->
                    <td>
                         <span class="badge rounded-pill"
                              th:classappend="${task.priority.name() == 'HIGH'} ? 'bg-danger' :
                                    (${task.priority.name() == 'MEDIUM'} ? 'bg-warning text-dark' : 'bg-success')"
                               th:text="${task.priority}">
                             </span>
                    </td>

                    <!-- WORKERS -->
                    <td  th:if="${isAdminPage}"
                         th:text="${task.workerFullName != null ? task.workerFullName : 'No worker assigned'}">
                    </td>


                    <td class="text-end">
                        <div class="btn-group btn-group-sm">
                            <a th:href="@{/tasks/{id}(id=${task.id})}" class="btn btn-outline-primary">View</a>
                            <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-outline-dark">Edit</a>
                            <form th:action="@{/tasks/{id}/delete(id=${task.id})}" th:method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger"
                                        onclick="return confirm('Delete this task?')">🗑</button>
                            </form>
                        </div>
                    </td>


                </tr>
                </tbody>
            </table>
            <nav aria-label="Page navigation" th:if="${totalPages > 0}">
                <ul class="pagination justify-content-center">
                    <li class="page-item"
                        th:classappend="${currentPage == 0} ? 'disabled'">

                        <a class="page-link"
                           th:href="${baseUrl
         + '?page=' + (currentPage - 1)
         + '&status=' + selectedStatus
         + '&keyword=' + keyword}">
                            Previous
                        </a>

                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">

                        <a class="page-link"
                           th:href="${baseUrl
         + '?page=' + i
         + '&status=' + selectedStatus
         + '&keyword=' + keyword}"
                           th:text="${i + 1}">
                        </a>

                    </li>
                    <li class="page-item"
                        th:classappend="${currentPage == totalPages - 1} ? 'disabled'">

                        <a class="page-link"
                           th:href="${baseUrl
         + '?page=' + (currentPage + 1)
         + '&status=' + selectedStatus
         + '&keyword=' + keyword}">
                            Next
                        </a>

                    </li>
                </ul>
            </nav>
        </div>

        <div th:if="${tasks.empty}" class="text-center py-5">
            <p class="text-muted">No tasks found. Time to relax! ☕</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
    flatpickr("#start-date", {
        enableTime: true,
        dateFormat: "Y-m-dTH:i", // Формат, который понимает Spring для LocalDateTime
        altInput: true,          // Покажет человеку красиво: 2026-04-12 13:00
        altFormat: "F j, Y H:i"
    });

    flatpickr("#end-date", {
        enableTime: true,
        dateFormat: "Y-m-dTH:i",
        altInput: true,
        altFormat: "F j, Y H:i"
    });
</script>
</body>
</html>
