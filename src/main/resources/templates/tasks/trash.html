<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .task-container { background: white; padding: 30px; border-radius: 15px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        /* Кастомные цвета для статусов, если не хочешь стандартные Bootstrap */
        .status-done { background-color: #d4edda; color: #155724; }
        .status-progress { background-color: #fff3cd; color: #856404; }
        .status-new { background-color: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>

<div class="container">
    <div class="task-container shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">🗑 Trash Bin</h1>
            <a th:href="@{/tasks}" class="btn btn-outline-primary">⬅ Back to Task List</a>
        </div>
        <div class="card mb-4 shadow-sm border-0">
            <div class="card-body bg-light">
                <form th:action="@{/templates/tasks}" method="get" class="row g-2 align-items-end">

                    <div class="col-md-3">
                        <label class="form-label small text-muted">Search:</label>
                        <input type="text" name="keyword" th:value="${keyword}"
                               class="form-control form-control-sm" placeholder="Task description...">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label small text-muted">Status:</label>
                        <select name="status" class="form-select form-select-sm">
                            <option value="">All</option>
                            <option value="NEW" th:selected="${selectedStatus == 'NEW'}">New</option>
                            <option value="IN_PROGRESS" th:selected="${selectedStatus == 'IN_PROGRESS'}">In Progress</option>
                            <option value="DONE" th:selected="${selectedStatus == 'DONE'}">Done</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label small text-muted">From:</label>
                        <input type="datetime-local" name="start" th:value="${#temporals.format(start, 'yyyy-MM-dd''T''HH:mm')}"
                               class="form-control form-control-sm">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted">To:</label>
                        <input type="datetime-local" name="end" th:value="${#temporals.format(end, 'yyyy-MM-dd''T''HH:mm')}"
                               class="form-control form-control-sm">
                    </div>

                    <div class="col-md-3 d-flex gap-1">
                        <button type="submit" class="btn btn-sm btn-primary flex-grow-1">Filter</button>
                        <a href="/tasks" class="btn btn-sm btn-outline-secondary">Reset</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Description</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${tasks}">
                    <td>
                        <a th:href="@{/tasks/{id}(id=${task.id})}"
                           th:text="${task.description}"
                           class="text-decoration-none fw-semibold text-dark"></a>
                    </td>
                    <td>
            <span class="badge rounded-pill"
                  th:classappend="${task.status.name() == 'DONE'} ? 'bg-success' :
                                  (${task.status.name() == 'IN_PROGRESS'} ? 'bg-warning text-dark' : 'bg-secondary')"
                  th:text="${task.status}">
            </span>
                    </td>
                    <td class="text-end">
                        <div class="btn-group btn-group-sm">
                            <form th:action="@{/tasks/restore/{id}(id=${task.id})}" th:method="post" class="d-inline me-1">
                                <button type="submit" class="btn btn-sm btn-success">Restore</button>
                            </form>

                            <form th:action="@{/tasks/hard-delete/{id}(id=${task.id})}" th:method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Вы уверены?')">Hard Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
            <nav aria-label="Page navigation" th:if="${totalPages > 0}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/tasks/trash(page=${currentPage - 1}, status=${selectedStatus}, keyword=${keyword})}">Previous</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/tasks/trash(page=${i}, status=${selectedStatus}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/tasks/trash(page=${currentPage + 1}, status=${selectedStatus}, keyword=${keyword})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>

        <div th:if="${tasks.empty}" class="text-center py-5">
            <p class="text-muted">No tasks found. Time to relax! ☕</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
