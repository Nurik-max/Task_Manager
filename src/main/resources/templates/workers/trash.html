<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Deleted Workers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>🗑️ Trash (Deleted Workers)</h1>
    <a href="/workers" class="btn btn-secondary">Back to Workers</a>
  </div>

  <table class="table table-hover shadow-sm bg-white rounded">
    <thead class="table-light">
    <tr>
      <th>Name</th>
      <th>Surname</th>
      <th>Position</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="worker : ${workers}">
      <td th:text="${worker.name}">Name</td>
      <td th:text="${worker.surname}">Surname</td>
      <td th:text="${worker.position}">Position</td>
      <td>
        <form th:action="@{/workers/{id}/restore(id=${worker.id})}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-sm btn-outline-success">Restore</button>
        </form>

<!--        <a th:href="@{/workers/{id}/edit(id=${worker.id})}" class="btn btn-sm btn-primary d-inline">-->
<!--          Редактировать-->
<!--        </a>-->

        <form th:action="@{/workers/{id}/force-delete(id=${worker.id})}" method="post" class="d-inline">
<!--          <input type="hidden" name="_method" value="DELETE"/>-->
          <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Вы уверены?')">Hard Delete</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
