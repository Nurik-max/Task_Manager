<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Workers List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Workers Directory</h1>
        <a href="/workers/new" class="btn btn-primary">➕ Add Worker</a>
    </div>

    <table class="table table-hover shadow-sm bg-white rounded">
        <thead class="table-light">
        <tr>
            <th>Name</th>
            <th>Surname</th>
            <th>Position</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="worker : ${workers}">
            <td th:text="${worker.username}">Name</td>
            <td th:text="${worker.surname}">Surname</td>
            <td th:text="${worker.position}">Position</td>
            <td>
                <a th:href="@{/workers/{id}/edit(id=${worker.id})}" class="btn btn-sm btn-outline-warning">Edit</a>

                <form th:action="@{/workers/{id}/delete(id=${worker.id})}" th:method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/tasks" class="btn btn-link">Back to Tasks</a>
</div>
</body>
</html>
