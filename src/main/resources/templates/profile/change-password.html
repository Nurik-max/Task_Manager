<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">

    <div class="card shadow-sm p-4">

        <h2 class="mb-4">Change Password</h2>

        <!-- Ошибка -->
        <div class="alert alert-danger"
             th:if="${error}"
             th:text="${error}">
        </div>

        <!-- Успех -->
        <div class="alert alert-success"
             th:if="${success}"
             th:text="${success}">
        </div>

        <form th:action="@{/profile/change-password}"
              method="post"
              th:object="${changePasswordDTO}">

            <!-- Old Password -->
            <div class="mb-3">
                <label class="form-label">Old Password</label>

                <input type="password"
                       th:field="*{oldPassword}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('oldPassword')} ? 'is-invalid'">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('oldPassword')}"
                     th:errors="*{oldPassword}">
                </div>
            </div>

            <!-- New Password -->
            <div class="mb-3">
                <label class="form-label">New Password</label>

                <input type="password"
                       th:field="*{newPassword}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('newPassword')}"
                     th:errors="*{newPassword}">
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>

                <input type="password"
                       th:field="*{confirmPassword}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('confirmPassword')}"
                     th:errors="*{confirmPassword}">
                </div>
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-between">

                <a th:href="@{${baseUrl}}" class="btn btn-outline-secondary">
                    Cancel
                </a>

                <button type="submit"
                        class="btn btn-primary">
                    Change Password
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
