<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Worker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm p-4">
        <h2 class="mb-4">Edit Profile</h2>

        <form th:action="@{/profile}" method="post" th:object="${worker}">
<!--            <input type="hidden" name="_method" value="PATCH"/>&ndash;&gt;-->

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{username}" class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Surname</label>
                <input type="text" th:field="*{surname}" class="form-control" th:classappend="${#fields.hasErrors('surname')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Position</label>
                <input type="text" th:field="*{position}" class="form-control" th:classappend="${#fields.hasErrors('position')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('position')}" th:errors="*{position}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" th:field="*{phone}" class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Current Status:</label>
                <span class="badge bg-info" th:text="${worker.workerStatus}"></span>
            </div>


            <a th:href="@{/profile}" class="btn btn-outline-secondary">
                Cancel
            </a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
            </div>
        </form>
    </div>
</div>
</body>
</html>
