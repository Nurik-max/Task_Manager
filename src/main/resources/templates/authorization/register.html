<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Task Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 80px;
        }

        .auth-container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body>

<div class="auth-container shadow-sm">

    <h2 class="text-center mb-4">📝 Register</h2>

    <form th:action="@{/register}" method="post" th:object="${worker}">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" th:field="*{username}" class="form-control" placeholder="Your name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Surname</label>
            <input type="text" th:field="*{surname}" class="form-control" placeholder="Your surname" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Position</label>
            <input type="text" th:field="*{position}" class="form-control" placeholder="Choose position" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" th:field="*{email}" class="form-control" placeholder="Choose email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="Create password" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirmPassword" class="form-control" placeholder="Repeat password" required>
        </div>

        <div th:if="${error}" class="alert alert-danger py-2">
            <span th:text="${error}"></span>
        </div>

        <button type="submit" class="btn btn-success w-100">Create Account</button>

    </form>

    <div class="text-center mt-3">
        <small>
            Already have an account?
            <a th:href="@{/login}">Login</a>
        </small>
    </div>

</div>

</body>
</html>
