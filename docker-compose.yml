services:
  app:
    build:
      context: .
    image: task-manager
    container_name: task-manager-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: task-manager-db
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - task_manager_postgres_data:/var/lib/postgresql/data


volumes:
  task_manager_postgres_data: